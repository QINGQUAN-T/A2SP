name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full regression (anchors + smoke + validation)
        run: python run_tests.py
      - name: Smoke-run both examples (--quick)
        run: |
          python examples/ex2_polymer.py --quick
          python examples/ex1_rumor.py --quick
      - name: Packaging smoke (pip install .)
        run: |
          pip install .
          python -c "import a2sp, os; print('installed a2sp', a2sp.__version__, 'from', os.path.dirname(a2sp.__file__))"
          python -c "from a2sp.core import reduced_solution; print(reduced_solution(0.25, 0.5, 1.0, 0.0))"
